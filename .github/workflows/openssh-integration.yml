name: OpenSSH integration

on: push

permissions:
  contents: read

jobs:
  openssh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: "true"
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Show integration tool versions
        run: |
          docker version
          docker compose version
          ssh -V
      - name: Test certificate authentication against OpenSSH
        run: |
          ./scripts/run_openssh_integration.sh -vv
