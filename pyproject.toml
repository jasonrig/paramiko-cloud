[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paramiko-cloud"
version = "2.0.0"
description = "Use cloud-managed keys to sign SSH certificates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jason Rigby", email = "hello@jasonrig.by" },
]
dependencies = [
  "paramiko>=5.0.0",
  "cryptography>=45.0.1",
  "protobuf",
  "grpcio-tools",
]

[project.optional-dependencies]
aws = ["boto3"]
gcp = ["google-cloud-kms"]
azure = ["azure-keyvault-keys", "azure-identity"]
all = [
  "boto3",
  "google-cloud-kms",
  "azure-keyvault-keys",
  "azure-identity",
]

[project.urls]
Homepage = "https://github.com/jasonrig/paramiko-cloud/"

[tool.setuptools]
include-package-data = true
packages = [
  "paramiko_cloud",
  "paramiko_cloud.dummy",
  "paramiko_cloud.aws",
  "paramiko_cloud.azure",
  "paramiko_cloud.gcp",
  "paramiko_cloud.protobuf",
]

[tool.setuptools.package-data]
paramiko_cloud = ["py.typed"]
"paramiko_cloud.protobuf" = ["*.pyi"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-paramiko>=5.0.0.20260724",
    "types-protobuf>=7.34.1.20260518",
    "types-grpcio>=1.83.0.20260730",
    "boto3-stubs[kms]>=1.43.62",
]
build = ["build"]
docs = [
  "sphinx",
  "paramiko",
  "cryptography",
  "boto3",
  "google-cloud-kms",
  "azure-keyvault-keys",
  "azure-identity",
  "protobuf",
  "grpcio-tools",
]

[tool.mypy]
python_version = "3.10"
exclude = "(^|/)paramiko_cloud/protobuf/.*_pb2.*\\.py$"

[tool.ruff]
target-version = "py310"
